add: Ajouter un trigger
edit: Editer un trigger
missing_reaction: >
    Le champ de texte contenant le nom du trigger est vide.
    Vous devez préciser une réaction pour ce trigger.
invalid_variable: >
    Le nom de la variable est vide ou invalide. Utilisez seulement des
    lettres, des chiffres et des signes soulignés.
mark: Trigger marqué
remove: >
    Êtes-vous sûr de vouloir retirer le trigger {trigger} ?
substitution: >
    Message de remplacement de la ligne ayant déclenché le trigger :
unknown: >
    Impossible de trouver ce trigger.
unsaved: >
    Il se trouve plusieurs triggers non sauvegardés dans la
    configuration. Si vous fermez cette boîte de dialogue sans
    sauvegarde, ces modifications seront perdues. Pour sauvegarder,
    cliquez sur 'non' puis sur 'ok'. Voulez-vous vraiment quitter
    cette boîte de dialogue sans sauvegarder ?
variable: "Nom de la variable :"
visibility: Visibilité de la ligne ayant déclenché le trigger
visible_always: Toujours visible
visible_never: Jamais visible (trigger muet)
visible_if_set: Visible seulement si la variable existe
visible_if_unset: Visible seulement si la variable n'existe pas
